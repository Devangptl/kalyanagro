<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a230d"/>
      <stop offset="60%" stop-color="#2c1a0e"/>
      <stop offset="100%" stop-color="#1a0e06"/>
    </linearGradient>
    <radialGradient id="spot" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#e8a020" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#e8a020" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shell" cx="32%" cy="28%" r="78%">
      <stop offset="0%" stop-color="#fde2a0"/><stop offset="22%" stop-color="#f2bf52"/>
      <stop offset="55%" stop-color="#c4881c"/><stop offset="82%" stop-color="#7a4a14"/>
      <stop offset="100%" stop-color="#3a230d"/>
