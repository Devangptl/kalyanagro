        <path d="M -95 -195 Q -85 -130 -75 -55"/><path d="M -60 -210 Q -55 -120 -50 -25"/>
        <path d="M -25 -215 Q -22 -100 -18 -10"/><path d="M  10 -215 Q  12 -100 16 -10"/>
        <path d="M  45 -210 Q  48 -120 52 -25"/><path d="M  80 -195 Q  85 -130 92 -55"/>
        <path d="M -100 70 Q -88 140 -65 220"/><path d="M -65 55 Q -55 145 -40 230"/>
        <path d="M -30 50 Q -25 145 -15 235"/><path d="M  10 50 Q  15 145 25 235"/>
        <path d="M  45 55 Q  55 145 70 230"/><path d="M  80 70 Q  92 140 110 220"/>
