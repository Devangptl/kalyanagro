      <stop offset="0%" stop-color="#9a9a9a"/><stop offset="40%" stop-color="#cfcfcf"/><stop offset="100%" stop-color="#4a4a4a"/>
    </linearGradient>
    <linearGradient id="bowlIn" x1="0" y1="0" x2="0" y2="1">
