      <path d="M 0 -220 C 110 -220, 145 -150, 130 -85 C 120 -40, 95 -20, 85 5 C 80 25, 90 50, 110 80 C 135 120, 140 180, 95 215 C 50 245, -50 245, -95 215 C -140 180, -135 120, -110 80 C -90 50, -80 25, -85 5 C -95 -20, -120 -40, -130 -85 C -145 -150, -110 -220, 0 -220 Z" fill="url(#shellHi)"/>
