  <rect width="600" height="400" fill="url(#bg)"/>
  <rect width="600" height="400" filter="url(#cracks)" opacity="0.5"/>
  <g fill="#3a230d" opacity="0.3">
    <circle cx="50" cy="80" r="3"/><circle cx="150" cy="120" r="2.5"/>
    <circle cx="510" cy="60" r="3"/><circle cx="560" cy="220" r="2.5"/>
