<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdf6ec"/><stop offset="60%" stop-color="#f7ecd6"/><stop offset="100%" stop-color="#e8d4ad"/>
    </linearGradient>
    <pattern id="linen" patternUnits="userSpaceOnUse" width="6" height="6">
      <rect width="6" height="6" fill="#f7ecd6"/>
      <path d="M 0 0 L 6 6 M 0 6 L 6 0" stroke="#d9bd83" stroke-width="0.4" opacity="0.5"/>
    </pattern>
    <radialGradient id="shell" cx="32%" cy="28%" r="78%"><stop offset="0%" stop-color="#fde2a0"/><stop offset="22%" stop-color="#f2bf52"/><stop offset="55%" stop-color="#c4881c"/><stop offset="82%" stop-color="#7a4a14"/><stop offset="100%" stop-color="#3a230d"/></radialGradient>
    <radialGradient id="shellHi" cx="30%" cy="22%" r="55%"><stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/><stop offset="55%" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
