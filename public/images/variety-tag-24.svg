  <rect width="600" height="400" fill="url(#bg)"/>
  <rect width="600" height="400" fill="url(#linen)" opacity="0.5"/>
  <path d="M 0 280 Q 200 250 400 290 Q 500 310 600 280 L 600 400 L 0 400 Z" fill="#d9bd83" opacity="0.4"/>
  <path d="M 0 280 Q 200 250 400 290 Q 500 310 600 280" stroke="#b89a5a" stroke-width="1" fill="none" opacity="0.5"/>
