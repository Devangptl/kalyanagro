    <line x1="560" y1="40" x2="520" y2="40"/><line x1="560" y1="40" x2="560" y2="80"/>
    <line x1="40" y1="360" x2="80" y2="360"/><line x1="40" y1="360" x2="40" y2="320"/>
    <line x1="560" y1="360" x2="520" y2="360"/><line x1="560" y1="360" x2="560" y2="320"/>
